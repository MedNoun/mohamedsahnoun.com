<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!--
      The console prompt: a chevron and a block cursor. Two heavy shapes, no
      fine detail, so it survives 16px. Colours are the site tokens, bg for the
      tile and accent for the glyph. The tile stays dark in both colour schemes,
      because the icon is a terminal, not a monogram.
    -->
    <rect width="128" height="128" rx="26" fill="#0B0E14" />
    <path
        d="M33 42 59 64 33 86"
        fill="none"
        stroke="#7FD1B9"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
    <rect x="77" y="43" width="26" height="42" rx="3" fill="#7FD1B9" />
</svg>
